# configs/flir_multi.yaml

# 1. 기본 경로 (프로젝트 루트 기준)
path: data

# 2. 학습 데이터 (리스트로 여러 경로 지정)
# 중요: 반드시 'images' 폴더 경로까지 적어야 합니다.
# YOLO는 이 경로 옆에 있는 ../labels 를 자동으로 찾습니다.
train:
  - RoboFlow_FLIR_Dataset_v27_yolo11/train/images
  - Flux.1-Fill-dev/split_1/images
  - Flux.1-Fill-dev/split_2/images
  - Flux.1-Fill-dev/split_3/images

# 3. 검증/테스트 데이터 (원본 데이터 사용)
val: RoboFlow_FLIR_Dataset_v27_yolo11/valid/images
test: RoboFlow_FLIR_Dataset_v27_yolo11/test/images

# 4. 클래스 정보
nc: 3
names: ['Person', 'Bicycle', 'Car']